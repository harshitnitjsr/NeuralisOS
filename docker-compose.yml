version: '3.8'

services:
  # Episodic Memory
  postgres:
    image: postgres:15-alpine
    container_name: aetheros-postgres
    environment:
      POSTGRES_USER: aether
      POSTGRES_PASSWORD: password
      POSTGRES_DB: aetheros
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  # Semantic Memory
  qdrant:
    image: qdrant/qdrant:latest
    container_name: aetheros-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  # Graph Memory
  neo4j:
    image: neo4j:5-community
    container_name: aetheros-neo4j
    environment:
      NEO4J_AUTH: neo4j/password
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
    restart: unless-stopped

  # Realtime Caching & Events
  redis:
    image: redis:7-alpine
    container_name: aetheros-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  # Procedural Memory / Event Sourcing
  zookeeper:
    image: confluentinc/cp-zookeeper:7.3.0
    container_name: aetheros-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.3.0
    container_name: aetheros-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

volumes:
  postgres_data:
  qdrant_data:
  neo4j_data:
  redis_data:
